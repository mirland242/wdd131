<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review by rating features, sharing your experience, and providing feedback to help other users make informed decisions.">
    <meta name="author" content="Mirland TSATY">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Product form</title>
</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main class="form-container">

    <form action="review.html" method="get">

        <!-- PRODUCT -->
        <div class="form-group">
            <label for="productName">Product name</label>
            <select id="productName" name="product" required>
                <option value="" disabled selected>Select a product...</option>
            </select>
        </div>

        <!-- RATING -->

        <div class="rating">
            <span>Rating</span>

            <input type="radio" id="star-rating1" name="rating" value="1" required>
            <label for="star-rating1">☆</label>

            <input type="radio" id="star-rating2" name="rating" value="2">
            <label for="star-rating2">☆☆</label>

            <input type="radio" id="star-rating3" name="rating" value="3">
            <label for="star-rating3">☆☆☆</label>

            <input type="radio" id="star-rating4" name="rating" value="4">
            <label for="star-rating4">☆☆☆☆</label>

            <input type="radio" id="star-rating5" name="rating" value="5">
            <label for="star-rating5">☆☆☆☆☆</label>
        </div>

        <!-- DATE -->
        <div class="form-group">
            <label for="date">Date of installation</label>
            <input type="date" id="date" name="date" required>
        </div>

        <!-- FEATURES -->
        <div class="form-group">
            <span class="label-title">Select your features</span>

            <label><input type="checkbox" name="features" value="durability"> Durability</label>
            <label><input type="checkbox" name="features" value="ease"> Ease to Use</label>
            <label><input type="checkbox" name="features" value="performance"> Performance</label>
            <label><input type="checkbox" name="features" value="design"> Design</label>
        </div>

        <!-- COMMENTS -->
        <div class="form-group">
            <label for="comments">
                Written Review <span class="optional">(optional)</span>
            </label>
            <textarea id="comments" name="comments" rows="6"
                placeholder="Write your review here..."></textarea>
        </div>

        <!-- NAME -->
        <div class="form-group">
            <label for="name">
                Your name <span class="optional">(optional)</span>
            </label>
            <input type="text" id="name" name="name"
                placeholder="Enter your name...">
        </div>

        <!-- SUBMIT -->
        <div class="form-group">
            <button type="submit">Submit Review</button>
        </div>

    </form>
    <p>Review count:<span id="reviewcount" class="label-title"></span></p>
</main>

<footer>
    <!-- <p><span id="updateDate"></span>🌊 Mirland TSATY</p>
    <p>Last modified: <span id="lastModified"></span></p> -->
    <p><span id="updatedDate">©2027</span>🌊 Mirland TSATY</p>
    <p>Last modified:<span id="lastModified"></span></p>
    
</footer>

</body>
</html>
